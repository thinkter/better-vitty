name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK on GitHub runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --non-interactive

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/better-vitty-ci-release.keystore \
            -storepass android \
            -alias better-vitty-ci \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Better Vitty CI,O=Better Vitty,C=US"

      - name: Build signed release APK on GitHub runner
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/better-vitty-ci-release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=better-vitty-ci \
            -Pandroid.injected.signing.key.password=android
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-vitty-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
